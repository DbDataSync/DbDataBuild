name: staging.customers
kind: view
grain: [customer_id]
columns:
  - {name: customer_id, type: INTEGER, nullable: false}
  - {name: first_name, type: "VARCHAR(80)"}
  - {name: last_name, type: "VARCHAR(80)"}
  - {name: email, type: "VARCHAR(100)", nullable: false}
  - {name: email_domain, type: "VARCHAR(100)"}
  - {name: country_code, type: "VARCHAR(2)", nullable: false}
  - {name: signup_date, type: DATE, nullable: false}
  - {name: marketing_opt_in, type: BOOLEAN, nullable: false}
