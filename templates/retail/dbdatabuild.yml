# Where the models are built, and how text behaves there (docs/operations.md, DESIGN.md 7.4).
#
# SQL Server ignores trailing spaces when it compares text and PostgreSQL does not, so one project profile cannot
# be exact on both: the engine the profile does not fit is reported (DDB-310) when you validate. This template is set
# up for SQL Server. For PostgreSQL, replace the next lines with:
#   defaults: {connections: [postgres]}
#   tracking: { connection: postgres }
#   string_semantics: { case: sensitive, trailing_space: significant, collations: { default: { duckdb: NFC, postgres: C } } }
defaults: {connections: [sqlserver]}
# where the records of what the tool builds are kept (drift, history, acknowledgements): nothing is tracked without it
tracking: { connection: sqlserver }

# The refresh plans (docs/concepts.md): `daily` is every mart (the folder file models/marts/_dbdatabuild.yml puts them in it) and
# `hourly` only the sales lines, which a model adds to its own file. `connection refresh sqlserver hourly` runs one; `project show refresh` reads them.
refresh:
  plans:
    hourly: { title: Sales lines, description: "New order lines, appended as they arrive.", expected_every: 1h }
    daily:  { title: All marts, description: "Every mart, rebuilt overnight.", expected_every: 1d, on_failure: continue }

# How this project is meant to operate (docs/concepts.md). What is written here is the default; leave it out to keep it.
# Retail refreshes every night, so the example asks for the database to be compared before it runs and for the history to be kept in full.
#   plans:
#     deploy:  { keep: database, audit: full }       # the plan is kept in the tracking tables and applied by its id: `connection deploy --write-plan`, then `connection deploy --apply-plan <id>`
#     refresh: { keep: committed, audit: standard }  # the refresh plan is compiled by `project compile` into rendered/<connection>/loads.yml and refresh/<plan>.yml
#   refresh: { check: live, on_fail: block }         # none | project | objects | live: `live` also catches a table changed outside the tool
#   retention: { statement_logs_days: 14 }           # local statement logs older than this are removed by the next deploy or refresh
string_semantics:
  case: sensitive
  trailing_space: ignored
  collations:
    default: { duckdb: NFC, sqlserver: Latin1_General_100_CS_AS }

# `validate` says where a construct behaves slightly differently on the engine than in DuckDB (DDB-302). Those findings are
# real and worth reading once; the project below has been checked, so they are notes here rather than warnings.
policy:
  severity:
    approximated: note

# fct_shipment_packages uses generate_series, which SQL Server has from version 16 (2022).
connections:
  sqlserver: { version: 16 }
