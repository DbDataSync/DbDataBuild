name: staging.product_cost_history
kind: view
grain:
  - product_id
  - valid_from
columns:
  - name: product_id
    type: INTEGER
    nullable: false
  - name: valid_from
    type: DATE
    nullable: false
  - name: valid_to
    type: DATE
  - name: standard_cost
    type: DECIMAL(19, 4)
    nullable: false
