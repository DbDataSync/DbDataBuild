- id: fn.strftime
  detect: [fn:STRFTIME]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/strftime_fn, note: "FORMAT and TO_CHAR do not use DuckDB's letters (%A %B %j come out as A B DDD). A lowered query writes strftime out as the pieces of its text for the specifiers %Y %y %m %d %H %M %S %f %j %I %p %a %A %b %B %w %u %% and the unpadded %-d %-m %-H %-I %-M %-S %-j, and refuses any other specifier (week numbers, zones, locale formats) with its name; only a model that is not lowered reaches this row." }
  fabric:    { status: unverified, note: "The same lowering; not run on Fabric." }
  postgres:  { status: unsupported, test: spike/strftime_fn, note: "As on SQL Server: TO_CHAR writes %A as %A. A lowered query is rewritten into pieces of text; a model that is not lowered reaches this row." }

- id: fn.format
  detect: [fn:FORMAT]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/format_fn, note: "DuckDB's format('{}|{}', a, b) takes {} placeholders; T-SQL's FORMAT takes a value and a .NET pattern. A lowered query writes the placeholders {} out as a concatenation of text (arguments of type VARCHAR, integers and DATE) and refuses {:05d} and the other specifications and arguments whose text differs between DuckDB and the engines (DOUBLE); only a model that is not lowered reaches this row." }
  fabric:    { status: unverified, note: "The same lowering; not run on Fabric." }
  postgres:  { status: unsupported, test: spike/format_fn, note: "PostgreSQL's format is printf-like (%s): format('{}|{}', a, b) comes back unchanged. A lowered query writes {} out as a concatenation; a model that is not lowered reaches this row." }

- id: fn.age
  detect: [fn:AGE]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/age_fn, note: "SQL Server has no AGE and no interval type. The target rule age-parts writes date_part(unit, age(a, b)) for year, month, day, hour, minute and second, and the comparison, ordering and equality of an age with an interval or another age, in T-SQL with DuckDB's borrowing rule (proven equal on 5449 pairs). What reaches this row cannot be exact: an age as a value or output column, in arithmetic, with the epoch or a sub-second part, over TIMESTAMP WITH TIME ZONE, or over an operand that holds a subquery or a random value (the expression repeats it). Write date_diff('month', a, b) or compute the parts." }
  fabric:    { status: unverified, note: "The same target rule is applied; not run on Fabric." }
  postgres:  { status: native, note: "PostgreSQL's AGE is DuckDB's exactly (5449 of 5449 pairs). The second of an age is the whole second (rule age-second); an age as an output column has no DDL type." }

