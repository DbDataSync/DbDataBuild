# Support matrix (DESIGN.md section 7): one row per construct with a known portability consequence.
# detect:  node:<polyglot Expression tag> | fn:<FUNCTION NAME> | detector:<name, see Detectors.cs>
# Per target: status (native|translated|approximated|emulated|unsupported|unverified), optional min_version, note, test.
# `tsql:` is shorthand for sqlserver + fabric; a specific key overrides it. (Not used below: no Fabric engine was available, so Fabric entries
# are `unverified` unless Microsoft's documentation settles them. Never copy a SQL Server result to Fabric.)
# test: spike/<id> points at a case in spike/constructs.yml until the conformance suite replaces it (milestone 3).
# Every status except native and unverified must name a test. Rows reflect polyglot-sql at the pinned commit (spike/RESULTS.md).

- id: op.div
  detect: node:div
  duckdb: native
  sqlserver: { status: approximated, test: spike/int_division_cols, note: "DuckDB 1.5 returns inf for x/0; the rewrite (CAST AS FLOAT / NULLIF) returns NULL." }
  fabric:    { status: unverified, note: "polyglot's fabric dialect emits plain `/` where its tsql dialect adds CAST AS FLOAT / NULLIF. On SQL Server that text is integer division (7/2 = 3, DuckDB gives 3.5); Fabric is expected to behave the same but this was not tested." }
  postgres:  { status: approximated, test: spike/abs_round, note: "Rewritten to DOUBLE PRECISION / NULLIF: x/0 gives NULL (not inf) and ROUND(<result>, n) fails (no round(double precision, int))." }

- id: fn.avg
  detect: node:avg
  duckdb: native
  sqlserver: { status: approximated, test: spike/avg_int, note: "AVG over integers truncates (4, DuckDB gives 4.5714...); DECIMAL results have a different scale (spike/avg_decimal)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: fn.length
  detect: node:length
  duckdb: native
  sqlserver: { status: approximated, test: spike/length_fn, note: "LEN() ignores trailing spaces; DuckDB length() counts them (str.len). A query that went through lowering is rewritten by the target rule length-trailing-spaces (LEN(s + 'x') - 1) and no longer reports this; a query that is not lowered still does. LEN counts UTF-16 code units: a character outside the Basic Multilingual Plane (an emoji) counts as 2, DuckDB counts 1." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: fn.try_cast
  detect: node:try_cast
  duckdb: native
  sqlserver: { status: approximated, test: spike/try_cast, note: "TRY_CAST('' AS INT) is 0 on T-SQL, NULL in DuckDB. Lowered string-to-number and string-to-date casts are rewritten by the target rule try-cast-parse (blank becomes NULL) and no longer report this. Still differs: a string DuckDB reads as a number the engine refuses ('12.7' as INTEGER is 13, '1e3' as INTEGER is 1000; NULL on SQL Server)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: unsupported, test: spike/try_cast, note: "No native try-cast: polyglot emits CAST, which raises an error on bad data. Lowered string-to-integer, -decimal and -double casts are rewritten by the target rule try-cast-parse (a CASE that tests the text and the range first) and no longer report this; a string-to-date cast, and any other TRY_CAST, still does. The same '12.7' and '1e3' differences as SQL Server apply." }

- id: type.cast_varchar_length
  detect: detector:cast_varchar_length
  duckdb: native
  sqlserver: { status: approximated, test: spike/cast_varchar_len, note: "CAST(x AS VARCHAR(n)) is emitted as VARCHAR(MAX): the length is lost. Declared `columns` stay the source of truth for lengths." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: approximated, test: spike/cast_varchar_len, note: "Emitted as TEXT: the length is lost." }

- id: str.unicode_literal
  detect: detector:unicode_literal
  duckdb: native
  sqlserver: { status: approximated, test: spike/unicode_literal, note: "No N'...' prefix is emitted, so characters outside the database code page are corrupted. Matches only when the code page covers them." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: str.eq
  detect: detector:string_equality
  duckdb: native
  sqlserver: { status: approximated, test: spike/str_eq_profile, note: "Equality, inequality and IN against string literals follow the target collation and trailing-space rules, not DuckDB's (str.eq.case, str.eq.trailing_space; DESIGN.md 7.4). Column-to-column comparisons are not yet detected (needs declared types)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: str.like.case
  detect: node:like
  duckdb: native
  sqlserver: { status: approximated, test: spike/like_case, note: "LIKE follows the column collation: case-insensitive under *_CI_* collations, case-sensitive in DuckDB." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: str.ilike
  detect: node:i_like
  duckdb: native
  sqlserver: { status: translated, test: spike/ilike, note: "Rewritten to LOWER(x) LIKE LOWER(y)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: str.concat
  detect: node:concat
  duckdb: native
  sqlserver: { status: approximated, test: spike/concat_pipes, note: "|| becomes +, which adds numbers when both operands are numeric. Only safe for string operands. A lowered query is rewritten by the target rule concat-plus (every || is written as +, because the transpile leaves || inside the arguments of strpos, starts_with and the like) and casts non-text operands itself, so it no longer reports this." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: approximated, test: spike/concat_pipes, note: "|| on non-string operands is an error on Postgres; DuckDB concatenates them." }

- id: fn.current_date
  detect: fn:CURRENT_DATE
  duckdb: native
  sqlserver: { status: emulated, test: spike/current_date_fn, note: "Written as CAST(GETDATE() AS DATE). The date is the one on each engine's own clock in its own time zone (DuckDB: its TimeZone setting, which `sample` and `test` use; SQL Server: the server's local time; PostgreSQL: the session TimeZone), so near midnight engines in different time zones return different dates. The spike matches on SQL Server 2022 and 2025 and PostgreSQL when the zones are the same (run with TZ=UTC), and does not when the DuckDB host is in another zone. Pass the date as a parameter when it must not depend on a clock." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native, note: "CURRENT_DATE is the date in the session TimeZone; see the SQL Server note for what that means across time zones." }

- id: fn.replace
  detect: fn:REPLACE
  duckdb: native
  sqlserver: { status: approximated, test: spike/replace_fn, note: "REPLACE matches using the collation: case-insensitive under *_CI_* collations, case-sensitive in DuckDB." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: fn.regexp
  detect: [fn:REGEXP_MATCHES, fn:REGEXP_LIKE, node:regexp_like, node:regexp_i_like]
  duckdb: native
  sqlserver: { status: translated, min_version: 17, test: spike/regexp, note: "REGEXP_LIKE exists from SQL Server 2025 at database compatibility level 170 (version 17). It is not recognized on 2022, nor on a 2025 server at level 160 (checked on both): set targets.sqlserver.version to the level you run, 16 or 17." }
  fabric:    { status: unverified, note: "Fabric support for REGEXP_LIKE not checked." }
  postgres:  { status: translated, test: spike/regexp, note: "Rewritten to the ~ operator." }

- id: fn.generate_series
  detect: [fn:GENERATE_SERIES]
  duckdb: native
  sqlserver: { status: translated, min_version: 16, test: spike/generate_series, note: "Verified end to end by the conformance test Integer_series_become_the_engines_own_generate_series_and_join_to_tables. The spike run (2026-10-07) reports SYNTAX_ERR on SQL Server for polyglot's raw text (`GENERATE_SERIES(1, 5) AS g(x)`: the column list is not accepted); the renderer's own output, which is what the test runs, is. Integer series only (lowering refuses the rest). GENERATE_SERIES exists from SQL Server 2022 (version 16) and names its column `value`; the renderer drops the column list T-SQL does not accept." }
  fabric:    { status: unverified, note: "Fabric support for GENERATE_SERIES not checked." }
  postgres:  { status: native }

- id: syntax.qualify
  detect: detector:qualify
  duckdb: native
  sqlserver: { status: emulated, test: spike/qualify, note: "Rewritten to a subquery with a window column filtered in an outer WHERE." }
  fabric:    { status: unverified, note: "Microsoft documents QUALIFY as supported in Fabric Data Warehouse (T-SQL surface area, checked 2026-09-30) and polyglot leaves it in place. Not tested on Fabric; the SQL Server proxy rejects it." }
  postgres:  { status: emulated, test: spike/qualify, note: "Rewritten to a subquery." }

- id: syntax.group_by_ordinal
  detect: detector:group_by_ordinal
  duckdb: native
  sqlserver: { status: unsupported, test: spike/group_by_ordinal, note: "GROUP BY 1 is emitted unchanged; SQL Server rejects it at run time, and ScriptDOM accepts it. Name the columns." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: syntax.group_by_all
  detect: detector:group_by_all
  duckdb: native
  sqlserver: { status: unsupported, test: spike/group_by_all, note: "GROUP BY ALL is emitted unchanged and is a syntax error on SQL Server 2022. List the grouping columns." }
  fabric:    { status: unverified, note: "Microsoft documents GROUP BY ALL as supported in Fabric Data Warehouse (T-SQL surface area, checked 2026-09-30) and polyglot emits it unchanged. Not tested on Fabric." }
  postgres: { status: unsupported, test: spike/group_by_all, note: "Emitted unchanged; PostgreSQL 17 rejects it." }

- id: type.list
  detect: node:array_func
  duckdb: native
  sqlserver: { status: unsupported, test: spike/list_literal, note: "List literals are emitted as [..], which T-SQL reads as a bracketed identifier." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: unverified, note: "Rewritten to ARRAY[..]; semantics (indexing, NULL handling) not verified." }

- id: type.struct
  detect: node:map_func
  duckdb: native
  sqlserver: { status: unsupported, test: spike/struct_literal, note: "Struct/map literals are emitted unchanged and are a syntax error." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: unsupported, test: spike/struct_literal, note: "Emitted unchanged; PostgreSQL rejects it." }

- id: fn.unnest
  detect: [fn:UNNEST, node:unnest]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/unnest, note: "UNNEST is not a T-SQL function." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: unverified, note: "Matched on one case; array semantics not verified." }

- id: fn.date_trunc
  detect: fn:DATE_TRUNC
  duckdb: native
  sqlserver: { status: approximated, test: spike/date_trunc_month, note: "Rewritten to DATETRUNC, which returns DATE for DATE input; DuckDB returns TIMESTAMP. The result type differs, so cast explicitly to the declared column type." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: op.interval_add
  detect: node:interval
  duckdb: native
  sqlserver: { status: approximated, test: spike/date_add_interval, note: "DATE + INTERVAL becomes DATEADD and stays DATE; DuckDB returns TIMESTAMP. Cast explicitly to the declared column type." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: fn.date_diff
  detect: fn:DATE_DIFF
  duckdb: native
  sqlserver: { status: translated, test: spike/date_diff, note: "DATEDIFF counts boundaries, as DuckDB does, except for week, which counts boundaries from the first day of the week the session sets (@@DATEFIRST) where DuckDB counts whole periods of seven days: a lowered query is rewritten by the target rule date-diff-weeks (the days between, divided by seven, toward zero)." }
  fabric:    { status: unverified, note: "Same text as SQL Server; Fabric not checked." }
  postgres:  { status: approximated, test: spike/date_diff, note: "day is exact. A lowered query is rewritten by the target rule date-diff-boundaries for year, quarter and month (the difference of the calendar fields, which counts the boundaries crossed as DuckDB does) and no longer reports this; polyglot alone writes AGE(), which counts whole elapsed months and years (2024-01-31 to 2024-03-01 is 2 months in DuckDB, 1 on PostgreSQL). week is rewritten by the target rule date-diff-weeks (below). The time units are as probed." }

- id: syntax.order_nulls
  detect: detector:order_nulls
  duckdb: native
  sqlserver: { status: emulated, test: spike/nulls_last, note: "Every ORDER BY is rewritten with a CASE WHEN x IS NULL expression to put NULLs last, as DuckDB does. This can defeat index use." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: syntax.join.using
  detect: detector:join_using
  duckdb: native
  sqlserver: { status: unsupported, test: spike/left_join_using, note: "JOIN ... USING is emitted unchanged and is a syntax error. Use ON." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: syntax.join.natural
  detect: detector:join_natural
  duckdb: native
  sqlserver: { status: unsupported, test: spike/natural_join, note: "NATURAL JOIN is emitted unchanged and is a syntax error. Use ON." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: syntax.distinct_on
  detect: detector:distinct_on
  duckdb: native
  sqlserver: { status: unverified, note: "Rewritten to ROW_NUMBER() filtering. DuckDB picks an arbitrary row per key without ORDER BY, so a deterministic differential test is not possible. Add ORDER BY to the model." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: native }

- id: syntax.sample
  detect: detector:sample
  duckdb: native
  sqlserver: { status: unsupported, test: spike/sample_clause, note: "USING SAMPLE is emitted unchanged and is a syntax error." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres: { status: unsupported, test: spike/sample_clause, note: "Emitted unchanged; PostgreSQL rejects it." }

- id: syntax.lateral
  detect: detector:lateral_subquery
  duckdb: native
  sqlserver: { status: translated, test: spike/lateral_join, note: "Rewritten to CROSS APPLY." }
  fabric:    { status: unverified, note: "Same text as SQL Server; Fabric support for APPLY not checked." }
  postgres:  { status: native }

- id: str.case_mapping
  detect: [node:upper, node:lower]
  duckdb: native
  sqlserver: { status: approximated, test: spike/case_mapping, note: "UPPER and LOWER use the engine's Unicode tables: DuckDB maps 'ß' to 'ẞ', SQL Server leaves it. ASCII and the usual accents agree." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: approximated, test: spike/case_mapping, note: "Under the C collation (the usual profile for PostgreSQL) upper() and lower() change ASCII letters only: 'é' stays 'é'. Under a UTF-8 locale collation they agree with DuckDB." }

- id: fn.pad
  detect: [fn:LPAD, fn:RPAD]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/pad_fn, note: "SQL Server has no LPAD or RPAD before 2025. A lowered query is rewritten by the target rule pad-to-length (LEFT(REPLICATE(p, n), n - LEN(s)) + s, and LEFT(s, n) for a string that is too long, as DuckDB cuts it) when the length is a literal up to 4000 and the pad a non-empty literal, and no longer reports this; any other use still does." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: fn.split_part
  detect: [fn:SPLIT_PART, fn:STRING_SPLIT, fn:ARRAY_EXTRACT]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/split_part_fn, note: "SQL Server has no split_part, and STRING_SPLIT returns a table (one character as the separator, and the position only from 2022). Split with CHARINDEX and SUBSTRING, or load the pieces some other way." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/split_part_fn, note: "DuckDB's split_part reaches the plan as array_extract(string_split(s, sep), n), which PostgreSQL does not have. A lowered query is rewritten by the target rule split-part (PostgreSQL's own split_part, which also gives '' past the last piece) and no longer reports this; string_split anywhere else still does. Differs: position 0 is an error on PostgreSQL and '' in DuckDB." }

- id: fn.contains
  detect: [node:contains, fn:CONTAINS]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/contains_fn, note: "CONTAINS is a full-text predicate on SQL Server, not a function. Write strpos(s, x) > 0 (CHARINDEX) or LIKE." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/contains_fn, note: "There is no contains(text, text) function. Write strpos(s, x) > 0." }

- id: fn.mode
  detect: [node:mode, fn:MODE]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/mode_fn, note: "No MODE aggregate. Group and count, then take the top row." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/mode_fn, note: "mode() is an ordered-set aggregate there (mode() WITHIN GROUP (ORDER BY x)), which polyglot does not produce." }

- id: fn.corr
  detect: [fn:CORR]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/corr_fn, note: "No CORR aggregate." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: fn.string_agg
  detect: [node:string_agg]
  duckdb: native
  sqlserver: { status: translated, test: spike/string_agg_fn, note: "STRING_AGG(x, sep) WITHIN GROUP (ORDER BY ...). The separator and the ORDER BY are kept by lowering. NULL values are skipped, as in DuckDB." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/string_agg_fn, note: "polyglot writes LISTAGG for PostgreSQL, which has no such function (string_agg is the PostgreSQL name). A lowered query is rewritten by the target rule string-agg-array (array_to_string(array_agg(x ORDER BY ...), sep): NULLs skipped, NULL for no rows) and no longer reports this; a string_agg without a separator still does." }

- id: fn.date_part_calendar
  detect: [detector:date_part_calendar]
  duckdb: native
  sqlserver: { status: approximated, test: spike/date_part_week, note: "date_part('week') becomes DATEPART(WEEK), which numbers weeks from the first Sunday or the DATEFIRST setting, not ISO weeks as DuckDB does; 'epoch' has no equivalent. (dow and isodow are rewritten by the target rule weekday-datefirst and agree.)" }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/date_part_week, note: "'epoch' is EXTRACT(epoch FROM x) on PostgreSQL, which polyglot does not produce for date_part; week and the other parts agree." }

- id: fn.substring_negative
  detect: [detector:substring_negative_start]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/substr_negative, note: "A negative start counts from the end of the string in DuckDB; SUBSTRING does not do that (and the two-argument form needs a length, which lowering adds). Use right(s, n) or substr(s, length(s) - n + 1)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: approximated, test: spike/substr_negative, note: "A negative start does not count from the end: SUBSTRING(s FROM -2) is the whole string." }

- id: syntax.recursive_cte
  detect: detector:recursive_cte
  duckdb: native
  sqlserver: { status: approximated, test: spike/recursive_cte, note: "The lowerer writes WITH RECURSIVE and the transpile drops the keyword. SQL Server stops at 100 levels of recursion (error 530) where DuckDB goes on, allows only UNION ALL between the parts (error 252 otherwise) and, in the anchor and the recursive part, wants every column to have the same type: the lowerer casts text and decimal columns in both parts. OPTION (MAXRECURSION n) cannot be put in a view, so a deeper hierarchy fails loudly there." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: fn.greatest_least
  detect: [fn:GREATEST, fn:LEAST]
  duckdb: native
  sqlserver: { status: translated, min_version: 16, test: spike/greatest_least_fn, note: "GREATEST and LEAST exist from SQL Server 2022 (version 16). Both skip NULL arguments, as DuckDB does (the engine probes compare them with NULLs in the data)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: type.decimal_product_wide
  detect: detector:wide_decimal_product
  duckdb: native
  sqlserver: { status: approximated, test: spike/decimal_product_wide, note: "A product of decimals that would be wider than 38 digits: DuckDB casts the operands to DECIMAL(38, s) and multiplies exactly (and raises an error on overflow); SQL Server cuts the scale of the result to 6 (never below) and rounds there, at every product of a chain. A chain of products with more than 6 decimals in all can differ in the last digit after the final cast (observed: a price times a discount times an exchange rate, in the fourth decimal). Keep the scales of a chain at 6 or less in all, round between the steps, or multiply as DOUBLE and round." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: fn.nth_value
  detect: [node:nth_value, fn:NTH_VALUE]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/nth_value_fn, note: "SQL Server has no NTH_VALUE (FIRST_VALUE and LAST_VALUE only). Rank the rows with row_number() and take the one at the position, in a CTE or a subquery." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: native }

- id: fn.json_extract_string
  detect: [fn:JSON_EXTRACT_STRING]
  duckdb: native
  sqlserver: { status: approximated, test: spike/json_extract_string_fn, note: "Rewritten to JSON_VALUE, which gives the same text for a scalar, NULL for a missing path, and agrees on the probes (numbers, booleans, nested names, array positions, null). It gives NULL where DuckDB gives the JSON text of an object or an array. The result is nvarchar(4000)." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/json_extract_string_fn, note: "polyglot writes `x ->> '$.a.b'`, which PostgreSQL rejects for text and which takes a key, not a path. A lowered query with a literal path of names and positions is rewritten by the target rule json-extract-string (json_extract_path_text) and no longer reports this; a computed path or a wildcard still does. The text of an object keeps the spacing of the document (DuckDB writes it without) ({\"x\": 1})." }

- id: fn.json_other
  detect: [fn:JSON_EXTRACT, node:json_extract, fn:JSON_VALID, fn:JSON_TYPE, fn:JSON_KEYS]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/json_other_fn, note: "json_extract returns JSON (a string keeps its quotes), which JSON_QUERY does not (it returns objects and arrays only); json_valid, json_type and json_keys have no counterpart. Use json_extract_string for a scalar, or keep the document apart from the query." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/json_other_fn, note: "json_extract is written as json_extract_path, which takes json (not text) and returns json; json_valid is not a function (PostgreSQL 16 has `IS JSON`). Use json_extract_string for a scalar." }

- id: fn.json_array_length
  detect: [node:json_array_length, fn:JSON_ARRAY_LENGTH]
  duckdb: native
  sqlserver: { status: unsupported, test: spike/json_array_length_fn, note: "SQL Server has no JSON_ARRAY_LENGTH. Count the elements with OPENJSON in a subquery." }
  fabric:    { status: unverified, note: "Observed on SQL Server only; no Fabric engine was available to test." }
  postgres:  { status: unsupported, test: spike/json_array_length_fn, note: "A lowered query is rewritten by the target rule json-array-length (the text is cast to json) and no longer reports this. A value that is not an array raises on PostgreSQL where DuckDB gives 0." }

- id: fn.regexp_full_match
  detect: [fn:REGEXP_FULL_MATCH, node:regexp_full_match]
  duckdb: native
